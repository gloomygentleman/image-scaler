[package]
name = "image-upscaler"
version = "0.1.0"
edition = "2021"
description = "CPU-only AI image upscaler (super-resolution) with a desktop GUI, written in Rust"

[dependencies]
# GUI (egui / eframe)
eframe = "0.28"

# Image loading/saving for many formats (png, jpeg, bmp, webp, tiff, gif, ...)
image = "0.25"

# Pure-Rust ONNX inference engine (no external runtime -> single binary).
# This is the default CPU backend; tiles are run in parallel across cores.
tract-onnx = "0.21"

# Data-parallel tile inference across CPU cores.
rayon = "1"

# Native file/folder dialogs
rfd = "0.14"

# HTTP client for optional model auto-download (rustls -> stays single-binary)
ureq = "2.10"

# Error handling
anyhow = "1"
vtracer = "0.6.5"
visioncortex = "=0.8.10"
resvg = { version = "0.47.0", default-features = false }

# Optional GPU backend via ONNX Runtime (`gpu` feature). Uses `load-dynamic`, so
# the onnxruntime library is loaded at run time (point to it with ORT_DYLIB_PATH
# or place it next to the binary). EPs are chosen per platform below. Enabling
# `gpu` means the build is no longer a single self-contained binary — it needs
# the onnxruntime shared library at run time (still no Python).
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = [
    "ndarray",
    "load-dynamic",
    "coreml",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = [
    "ndarray",
    "load-dynamic",
    "directml",
] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = [
    "ndarray",
    "load-dynamic",
] }

[features]
default = []
gpu = ["dep:ort"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
